name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs-version: ['29.1', '30.1', '31.1']

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - uses: emacs-eask/setup-eask@master
        with:
          version: 'snapshot'

      - name: Install dependencies
        run: eask install-deps --dev

      - name: Report SQLite availability
        run: eask exec emacs -Q --batch --eval "(princ (format \"sqlite-available-p=%S\" (and (fboundp 'sqlite-available-p) (sqlite-available-p))))"

      - name: Compile sources
        run: eask compile --strict

      - name: Compile tests
        run: eask run script compile-tests

      - name: Check indentation
        run: eask run script indent

      - name: Test
        run: eask run script test

      - name: Check documentation
        if: matrix.emacs-version == '31.1'
        run: eask run script checkdoc

      - name: Lint package
        if: matrix.emacs-version == '31.1'
        run: eask run script package

      - name: Clean generated files
        if: always()
        run: eask run script clean-generated

      - name: Check clean tree
        if: always()
        run: |
          test -z "$(find . -name '*.elc' -print -quit)"
          if git ls-files | grep -E '\.elc$|(^|/)(\.eask|build|dist)/'; then
            exit 1
          fi
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
